# 跟随上游 tag 自动构建。
name: upstream-sync

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh api 'repos/openai/codex/releases?per_page=30' --jq '[.[] | select(.prerelease==false and (.tag_name | test("^rust-v[0-9]+[.][0-9]+[.][0-9]+$")))][0].tag_name')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          if gh api "repos/${{ github.repository }}/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，无需重建。" >&2
            exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Notify new version
        if: steps.decide.outputs.tag != ''
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 检测到新版本
          body: |
            版本：${{ steps.decide.outputs.tag }}
            运行：#${{ github.run_number }}
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: calypso
          level: active
          group: codex-capacity-build

      - name: Clone upstream tag and apply patch
        if: steps.decide.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --depth 1 -b "$TAG" https://github.com/openai/codex.git codex-src
          cd codex-src
          if git apply --check ../patches/codex.patch 2>/tmp/apply.err; then
            git apply ../patches/codex.patch
          elif git apply -C1 --check ../patches/codex.patch 2>>/tmp/apply.err; then
            git apply -C1 ../patches/codex.patch # 上游在补丁附近改了上下文，放宽匹配仍可自动套用
          else
            echo "Failed to apply patches/codex.patch to $TAG" >&2
            head -c 3000 /tmp/apply.err >&2
            exit 1
          fi

          # 官方 Windows 构建的迁移文件是 CRLF（sqlx 校验和按字节计算）。
          # Linux 克隆是 LF，必须转换，否则状态库与官方二进制互不兼容。
          # 覆盖全部六个目录：migrations（主库 state_5 用）+ 五个 *_migrations。
          find codex-rs/state -type f -name '*.sql' -exec sed -i 's/\r\?$/\r/' {} +

          # 防回归断言：state 下不允许再存在任何 LF-only 的 .sql
          if grep -rLI $'\r' codex-rs/state --include='*.sql' | grep -q .; then
            echo 'LF-only migration files remain:' >&2
            grep -rLI $'\r' codex-rs/state --include='*.sql' >&2
            exit 1
          fi
          echo "CRLF check OK: $(find codex-rs/state -name '*.sql' | wc -l) migration files all CRLF"

      - name: Resolve upstream commit
        if: steps.decide.outputs.tag != ''
        id: commit
        run: echo "sha=$(git -C codex-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Pack patched source
        if: steps.decide.outputs.tag != ''
        run: tar --exclude='.git' -czf source.tgz codex-src

      - name: Upload patched source
        if: steps.decide.outputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: patched-source
          path: source.tgz
          if-no-files-found: error
          retention-days: 3

      - name: Notify patch failure
        if: failure()
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 补丁失败
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: suspense
          level: timeSensitive
          group: codex-capacity-build

  test:
    needs: patch
    if: needs.patch.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Notify test started
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 正在测试
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: calypso
          level: active
          group: codex-capacity-build

      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: Extract source to short path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\c | Out-Null
          tar -xzf source.tgz -C C:\c --strip-components=1

      - name: Resolve toolchain
        id: tc
        shell: pwsh
        run: |
          $m = Select-String -Path C:/c/codex-rs/rust-toolchain.toml -Pattern 'channel = "(.+)"' | Select-Object -First 1
          "toolchain=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Install Rust ${{ steps.tc.outputs.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.toolchain }}
          components: rustfmt

      - name: Configure Cargo for Windows long paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\c\cargo | Out-Null
          "CARGO_HOME=C:\c\cargo" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
          git config --global core.longpaths true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:/c/codex-rs -> target
          shared-key: capacity-retry

      - name: Check formatting
        shell: pwsh
        run: cargo fmt --manifest-path C:/c/codex-rs/Cargo.toml --all -- --check

      - name: Run focused tests
        shell: pwsh
        run: >
          cargo test --manifest-path C:/c/codex-rs/Cargo.toml
          -p codex-core --lib server_overloaded_fast_retry
          -- --nocapture

      - name: Notify test failure
        if: failure()
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 测试失败
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: suspense
          level: timeSensitive
          group: codex-capacity-build

  build:
    needs: [patch, test]
    if: needs.patch.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CACHE_ON_FAILURE: true
      # 与官方构建一致：把官方 tag 的提交号嵌入二进制，
      STABLE_GIT_COMMIT: ${{ needs.patch.outputs.commit }}
    steps:
      - name: Notify build started
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 正在编译
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: calypso
          level: active
          group: codex-capacity-build

      - name: Download patched source
        uses: actions/download-artifact@v4
        with:
          name: patched-source

      - name: Extract source to short path
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\c | Out-Null
          tar -xzf source.tgz -C C:\c --strip-components=1

      - name: Resolve toolchain
        id: tc
        shell: pwsh
        run: |
          $m = Select-String -Path C:/c/codex-rs/rust-toolchain.toml -Pattern 'channel = "(.+)"' | Select-Object -First 1
          "toolchain=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Install Rust ${{ steps.tc.outputs.toolchain }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.tc.outputs.toolchain }}

      - name: Configure Cargo for Windows long paths
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force C:\c\cargo | Out-Null
          "CARGO_HOME=C:\c\cargo" >> $env:GITHUB_ENV
          "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> $env:GITHUB_ENV
          git config --global core.longpaths true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:/c/codex-rs -> target
          shared-key: capacity-retry

      - name: Build Windows Codex executable
        shell: pwsh
        run: >
          cargo build --manifest-path C:/c/codex-rs/Cargo.toml
          --release -p codex-cli --bin codex

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: codex-windows-x64
          path: C:/c/codex-rs/target/release/codex.exe
          if-no-files-found: error
          retention-days: 7

      - name: Verify executable
        shell: pwsh
        run: |
          C:\c\codex-rs\target\release\codex.exe --version
          C:\c\codex-rs\target\release\codex.exe --help | Select-Object -First 5

      - name: Notify build failure
        if: failure()
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 编译失败
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: suspense
          level: timeSensitive
          group: codex-capacity-build

  release:
    needs: [patch, test, build]
    if: needs.patch.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Notify release started
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 正在发布
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: calypso
          level: active
          group: codex-capacity-build

      - uses: actions/download-artifact@v4
        with:
          name: codex-windows-x64

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.patch.outputs.tag }}
        run: |
          SHA256="$(sha256sum codex.exe | cut -d' ' -f1)"
          REL="$TAG"
          NOTES="based on $TAG

          SHA256: \`$SHA256\`"
          gh release create "$REL" -R "${{ github.repository }}" --title "$REL" --notes "$(printf "$NOTES")" codex.exe

      - name: Notify release success
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 发布成功
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: calypso
          level: active
          group: codex-capacity-build
          url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ needs.patch.outputs.tag }}

      - name: Notify release failure
        if: failure()
        continue-on-error: true
        uses: harryzcy/action-bark@v2.4.0
        with:
          status: custom
          title: Codex 发布失败
          device_key: ${{ secrets.BARK_DEVICE_KEY }}
          bark_server_url: https://api.day.app
          sound: suspense
          level: timeSensitive
          group: codex-capacity-build
